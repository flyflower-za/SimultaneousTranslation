<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>Simultaneous Translation - Viewer</title>
    <link rel="stylesheet" href="styles.css?v=20260827">
    <!-- Opus 解码库 -->
    <script type="module">
        (async () => {
            try {
                const opusModule = await import('https://cdn.jsdelivr.net/npm/opus-decoder@0.7.0/+esm');
                console.log('Opus 模块导出:', Object.keys(opusModule));
                
                // 尝试不同的导出名称
                const OpusDecoder = opusModule.OpusDecoder || opusModule.default || opusModule;
                window.OpusDecoder = OpusDecoder;
                window.OpusDecoderReady = true;
                console.log('✓ Opus 解码器库已加载');
                console.log('OpusDecoder 类型:', typeof OpusDecoder);
                // 触发自定义事件通知库已加载
                window.dispatchEvent(new Event('opusDecoderReady'));
            } catch (error) {
                console.error('❌ Opus 解码器库加载失败:', error);
                window.OpusDecoderReady = false;
            }
        })();
    </script>
    <link rel="stylesheet" href="viewer.css?v=20260924">
</head>
<body>
    <div class="container">
        <header>
            <div class="viewer-header">
                <h1>Simultaneous Translation - Viewer</h1>
                <div class="viewer-controls">
                    <div class="viewer-status" id="connectionStatus">Disconnected</div>
                    <div class="viewer-fontsize-control" title="字体大小（最大 500%）">
                        <span class="label">字体</span>
                        <input id="viewerFontSize" type="range" min="100" max="500" step="10" value="100" />
                        <span class="value" id="viewerFontSizeValue">100%</span>
                    </div>
                    <div class="tts-playback-toggle">
                        <label for="ttsPlayback" class="toggle-label">
                            <span>Audio Playback</span>
                            <input type="checkbox" id="ttsPlayback">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <button class="page-fullscreen-btn" id="pageFullscreenBtn" title="Page Fullscreen">
                        <svg class="page-fullscreen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                        </svg>
                        <svg class="page-exit-fullscreen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                            <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="viewer-layout">
            <!-- 原文区域 -->
            <div class="text-section" id="sourceTextSection">
                <div class="translation-box">
                    <div class="translation-box-header">
                        <h2>Source Text (ASR)</h2>
                        <button class="fullscreen-btn" id="sourceFullscreenBtn" title="Fullscreen">
                            <svg class="fullscreen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                            </svg>
                            <svg class="exit-fullscreen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="text-display" id="sourceText">Waiting for connection...</div>
                </div>
            </div>

            <!-- 译文区域 -->
            <div class="text-section" id="targetTextSection">
                <div class="translation-box">
                    <div class="translation-box-header">
                        <h2>Translation</h2>
                        <button class="fullscreen-btn" id="targetFullscreenBtn" title="Fullscreen">
                            <svg class="fullscreen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                            </svg>
                            <svg class="exit-fullscreen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="text-display" id="targetText">Waiting for connection...</div>
                </div>
            </div>
        </main>
        <section id="minutesPanel" hidden style="margin:24px auto;max-width:960px;padding:24px;background:#fff;color:#202638;border-radius:16px;box-shadow:0 10px 28px #0002;">
            <h2 style="margin-top:0;">会议纪要</h2>
            <p id="minutesStatus">正在读取纪要状态…</p>
            <pre id="minutesContent" style="white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.7;"></pre>
        </section>
    </div>

    <script src="shared.js?v=20260924"></script>
    <script src="viewer.js?v=20260924"></script>
</body>
</html>
